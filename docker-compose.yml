# Production docker-compose using pre-built images
# For development with local builds, use: docker-compose -f docker-compose.dev.yml up

services:
  db:
    image: postgres:18-alpine
    container_name: nomdb-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-nomdb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nomdb_secret}
      POSTGRES_DB: ${DB_NAME:-nomdb}
    ports:
      # Bind to localhost only - the DB must not be reachable from the network in production
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # postgres:18 images mount the version-aware parent dir, not .../data
      - postgres_data:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nomdb} -d ${DB_NAME:-nomdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ghcr.io/obermarclp/the-nom-database/backend:latest
    container_name: nomdb-backend
    env_file:
      - .env
    environment:
      # DATABASE_URL needs special handling for docker-compose interpolation
      DATABASE_URL: postgres://${DB_USER:-nomdb}:${DB_PASSWORD:-nomdb_secret}@db:5432/${DB_NAME:-nomdb}?sslmode=disable
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: ghcr.io/obermarclp/the-nom-database/frontend:latest
    container_name: nomdb-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
